name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14            # Apple Silicon
    steps:
      - uses: actions/checkout@v6

      - name: Install cmake
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Cache vendored whisper.cpp build
        uses: actions/cache@v5
        with:
          path: Vendor
          key: whisper-${{ runner.os }}-${{ hashFiles('Scripts/bootstrap.sh', 'Scripts/build_whisper.sh') }}

      - name: Vendor + build whisper.cpp (Metal)
        run: '[ -f Vendor/whisper-install/lib/libwhisper.a ] || Scripts/bootstrap.sh'

      - name: Build
        run: swift build

      - name: Test
        run: .build/debug/TalktyTests
